name: Phantom Watch Bot (24/7)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

concurrency:
  group: phantom-watch-bot
  cancel-in-progress: true

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap nikto whatweb git python3-pip curl fonts-dejavu-core

      - name: Install Python tools
        run: |
          sudo pip3 install --break-system-packages theharvester dnstwist "python-telegram-bot[job-queue]" fpdf2 requests playwright trufflehog
          sudo pip3 install --break-system-packages theharvester dnstwist "python-telegram-bot[job-queue]" fpdf2 requests playwright trufflehog libsql-experimental


      - name: Install Playwright browsers
        run: |
          sudo python3 -m playwright install-deps
          python3 -m playwright install chromium

      - name: Clone metagoofil
        run: git clone https://github.com/laramies/metagoofil.git /home/runner/metagoofil

      - name: Clone sherlock and install
        run: |
          git clone https://github.com/sherlock-project/sherlock.git /home/runner/sherlock
          cd /home/runner/sherlock && pip3 install --break-system-packages .

      - name: Install Nuclei
        run: |
          wget -q https://github.com/projectdiscovery/nuclei/releases/download/v3.3.7/nuclei_3.3.7_linux_amd64.zip
          unzip -q nuclei_3.3.7_linux_amd64.zip
          sudo mv nuclei /usr/local/bin/
          nuclei -update-templates

      - name: Install Subfinder
        run: |
          wget -q https://github.com/projectdiscovery/subfinder/releases/download/v2.6.6/subfinder_2.6.6_linux_amd64.zip
          unzip -q subfinder_2.6.6_linux_amd64.zip
          sudo mv subfinder /usr/local/bin/

      - name: Install FFUF
        run: |
          wget -q https://github.com/ffuf/ffuf/releases/download/v2.1.0/ffuf_2.1.0_linux_amd64.tar.gz
          tar xzf ffuf_2.1.0_linux_amd64.tar.gz
          sudo mv ffuf /usr/local/bin/

      - name: Install Gitleaks
        run: |
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz
          tar xzf gitleaks_8.18.2_linux_x64.tar.gz
          sudo mv gitleaks /usr/local/bin/

      - name: Install MassDNS
        run: |
          sudo apt-get install -y build-essential git
          git clone --depth 1 https://github.com/blechschmidt/massdns.git /tmp/massdns
          cd /tmp/massdns && make -j$(nproc) && sudo cp bin/massdns /usr/local/bin/
          wget -q https://raw.githubusercontent.com/blechschmidt/massdns/master/lists/resolvers.txt -O /tmp/resolvers.txt

      - name: Install Prowler (PyPI)
        run: |
          pip3 install --break-system-packages prowler

      - name: Install SpiderFoot (from source)
        run: |
          git clone --depth 1 https://github.com/smicallef/spiderfoot.git /opt/spiderfoot
          cd /opt/spiderfoot
          pip3 install --break-system-packages -r requirements.txt

      - name: Install ReconSpider (from source)
        run: |
          git clone --depth 1 https://github.com/bhavsec/reconspider.git /opt/reconspider
          cd /opt/reconspider
          pip3 install --break-system-packages -r requirements.txt

      - name: Run Phantom Watch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          HIBP_API_KEY: ${{ secrets.HIBP_API_KEY }}
          TURSO_DB_URL: ${{ secrets.TURSO_DB_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: python3 -m bot.main
