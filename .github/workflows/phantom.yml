name: Phantom Watch Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap nikto whatweb git python3-pip curl

      - name: Install Python-based tools (pip)
        run: |
          pip3 install --break-system-packages theharvester dnstwist python-telegram-bot

      - name: Clone metagoofil into ~/metagoofil
        run: |
          git clone https://github.com/laramies/metagoofil.git ~/metagoofil

      - name: Clone sherlock into ~/sherlock and install its dependencies
        run: |
          git clone https://github.com/sherlock-project/sherlock.git ~/sherlock
          cd ~/sherlock
          pip3 install --break-system-packages -r requirements.txt

      - name: Clone spiderfoot and create a wrapper command
        run: |
          git clone https://github.com/smicallef/spiderfoot.git ~/spiderfoot
          pip3 install --break-system-packages -r ~/spiderfoot/requirements.txt
          # Create a globally available 'spiderfoot' command that runs sf.py
          printf '#!/bin/bash\npython3 ~/spiderfoot/sf.py "$@"\n' | sudo tee /usr/local/bin/spiderfoot
          sudo chmod +x /usr/local/bin/spiderfoot

      - name: Run Phantom Watch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        run: python3 phantomwatch.py
