name: Phantom Watch Bot

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y nmap nikto whatweb git python3-pip curl

      - name: Install Python-based tools (pip)
        run: |
          pip3 install --break-system-packages theharvester dnstwist python-telegram-bot

      - name: Clone metagoofil into /home/runner/metagoofil
        run: |
          git clone https://github.com/laramies/metagoofil.git /home/runner/metagoofil

      - name: Clone sherlock and install it (no requirements.txt needed)
        run: |
          git clone https://github.com/sherlock-project/sherlock.git /home/runner/sherlock
          cd /home/runner/sherlock
          pip3 install --break-system-packages .

      - name: Clone spiderfoot and create wrapper command
        run: |
          git clone https://github.com/smicallef/spiderfoot.git /home/runner/spiderfoot
          cd /home/runner/spiderfoot
          pip3 install --break-system-packages .
          sudo printf '#!/bin/bash\npython3 /home/runner/spiderfoot/sf.py "$@"\n' > /usr/local/bin/spiderfoot
          sudo chmod +x /usr/local/bin/spiderfoot

      - name: Run Phantom Watch
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        run: python3 phantomwatch.py
